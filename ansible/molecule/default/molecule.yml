---
# molecule test: create a Rocky Linux 9 host (systemd in Docker), apply site.yml twice
# (the second run must change nothing), verify, destroy.
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: docker
platforms:
  - name: jenkins-host
    image: geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: ""
    privileged: true # systemd and a nested Docker daemon
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/lib/docker # overlay2 cannot sit on the container's own overlay filesystem
    groups: [jenkins]
provisioner:
  name: ansible
  inventory:
    group_vars:
      jenkins:
        # Container kernels (Docker Desktop, CI runners) lack nftables features firewalld needs;
        # the firewall tasks run on real hosts only.
        hardening_firewall: false
        # Kernel-level settings would change the machine running the tests, not the container:
        # they are written to disk but not applied.
        hardening_sysctl_apply: false
        hardening_auditd_service: false
        docker_audit_rules_load: false
        # Building the Jenkins images is covered by the pipeline; the test stops before `compose up`.
        jenkins_stack_start: false
verifier:
  name: ansible
