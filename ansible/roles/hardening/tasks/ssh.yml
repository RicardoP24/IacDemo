---
- name: Install the OpenSSH server
  ansible.builtin.dnf:
    name: openssh-server
    state: present

- name: Generate missing SSH host keys
  ansible.builtin.command: ssh-keygen -A
  args:
    creates: /etc/ssh/ssh_host_ed25519_key

# RHEL 9 includes sshd_config.d/*.conf before its own settings and sshd keeps the
# first value it reads for each keyword, so this file wins over 50-redhat.conf.
- name: Deploy the SSH hardening settings
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-iacdemo-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Enable and start sshd
  ansible.builtin.systemd_service:
    name: sshd
    enabled: true
    state: started
