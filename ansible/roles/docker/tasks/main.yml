---
- name: Remove packages that conflict with Docker Engine
  ansible.builtin.dnf:
    name: "{{ docker_conflicting_packages }}"
    state: absent

- name: Import Docker's signing key (fingerprint verified)
  ansible.builtin.rpm_key:
    key: "{{ docker_gpg_key_url }}"
    fingerprint: "{{ docker_gpg_key_fingerprint }}"
    state: present

- name: Add Docker's repository (signed packages only)
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable - $basearch
    baseurl: https://download.docker.com/linux/{{ docker_repo_distro }}/$releasever/$basearch/stable
    gpgcheck: true
    gpgkey: "{{ docker_gpg_key_url }}"
    enabled: true

- name: Install Docker Engine and the Compose plugin
  ansible.builtin.dnf:
    name: "{{ docker_packages }}"
    state: present

- name: Create the Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure the Docker daemon
  ansible.builtin.copy:
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Audit changes to the container runtime
  ansible.builtin.copy:
    src: docker.rules
    dest: /etc/audit/rules.d/60-docker.rules
    owner: root
    group: root
    mode: "0600"
  notify: Load Docker audit rules

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
