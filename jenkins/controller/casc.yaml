jenkins:
  systemMessage: "IacDemo: DevSecOps CI/CD for a multi-tenant EKS platform (configured as code)"
  # The controller never runs builds; everything runs on the agent.
  numExecutors: 0
  mode: EXCLUSIVE

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  nodes:
    - permanent:
        name: "devsecops-agent"
        labelString: "devsecops"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 2
        retentionStrategy: "always"
        nodeProperties:
          - envVars:
              env:
                # Docker CLI -> DinD daemon over mutual TLS
                - key: "DOCKER_HOST"
                  value: "tcp://docker:2376"
                - key: "DOCKER_TLS_VERIFY"
                  value: "1"
                - key: "DOCKER_CERT_PATH"
                  value: "/certs/client"
        launcher:
          ssh:
            host: "agent"
            port: 22
            credentialsId: "agent-ssh-key"
            launchTimeoutSeconds: 60
            maxNumRetries: 10
            retryWaitTime: 15
            sshHostKeyVerificationStrategy:
              manuallyTrustedKeyVerificationStrategy:
                requireInitialManualTrust: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              scope: SYSTEM
              id: "agent-ssh-key"
              username: "jenkins"
              description: "Controller -> agent SSH key (generated by jenkins/setup.sh)"
              privateKeySource:
                directEntry:
                  privateKey: "${readFile:/run/secrets/agent_ssh_key}"

unclassified:
  location:
    url: "http://localhost:8080/"

jobs:
  - script: >
      multibranchPipelineJob('iacdemo') {
        displayName('IacDemo - multi-tenant EKS')
        branchSources {
          git {
            id('iacdemo')
            remote('${IACDEMO_REPO_URL:-https://github.com/RicardoP24/IacDemo.git}')
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(5)
          }
        }
        triggers {
          periodicFolderTrigger {
            interval('5m')
          }
        }
      }
